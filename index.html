<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quadros</title>
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#192028" media="(prefers-color-scheme: dark)">
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1F5; --surface:#FFFFFF; --surface-2:#F5F7FA; --hover:#EAF2FA;
  --ink:#1C2733; --ink-2:#5B6670; --ink-3:#8A949E; --line:#DCE2E8;
  --brand:#1B75BC; --brand-ink:#FFFFFF;
  --st-todo:#C9CFD5; --st-todo-ink:#26313B;
  --st-doing:#FBB03F; --st-doing-ink:#2B1D00;
  --st-stuck:#ED1C24; --st-stuck-ink:#FFFFFF;
  --st-done:#8CC63F; --st-done-ink:#18260A;
  --late:#D0151C; --shadow:0 12px 32px rgba(20,40,60,.18);
  --font:"Schibsted Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11161B; --surface:#192028; --surface-2:#1F2730; --hover:#1E3346;
    --ink:#E4EAF0; --ink-2:#9DA9B5; --ink-3:#6E7A86; --line:#2B3540;
    --brand:#3D95DA; --st-todo:#4E5964; --st-todo-ink:#EEF2F5; --late:#FF5A5F;
    --shadow:0 12px 32px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161B; --surface:#192028; --surface-2:#1F2730; --hover:#1E3346;
  --ink:#E4EAF0; --ink-2:#9DA9B5; --ink-3:#6E7A86; --line:#2B3540;
  --brand:#3D95DA; --st-todo:#4E5964; --st-todo-ink:#EEF2F5; --late:#FF5A5F;
  --shadow:0 12px 32px rgba(0,0,0,.5); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.layout{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100dvh}
.m-out,.fab-p{display:none}
.ddots,.daylist{display:none}
.day{cursor:default}
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;letter-spacing:-.01em;padding:0 6px}
.mark{display:grid;grid-template-columns:repeat(2,8px);gap:2px}
.mark i{width:8px;height:8px;border-radius:2px;display:block}
.boards{display:flex;flex-direction:column;gap:2px}
.board-link{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:8px 8px;border-radius:8px;color:var(--ink)}
.board-link:hover{background:var(--surface-2)}
.board-link[aria-current="true"]{background:var(--hover);font-weight:600}
.sw{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.bn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bc{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.ghost{border:1px dashed var(--line);background:transparent;border-radius:8px;padding:8px 10px;color:var(--ink-2);text-align:left}
.ghost:hover{border-color:var(--brand);color:var(--brand)}
.people{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.person{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2)}

.main{min-width:0;padding:24px 28px 64px}
.bhead{margin-bottom:18px}
.title-row{display:flex;align-items:center;gap:8px}
.btitle{font-size:28px;font-weight:700;letter-spacing:-.02em;border:1px solid transparent;background:transparent;border-radius:8px;padding:2px 8px;margin-left:-9px;min-width:4ch;flex:0 1 auto;max-width:100%;field-sizing:content}
.btitle:hover{border-color:var(--line)}
.btitle:focus{border-color:var(--brand);outline:none;background:var(--surface)}
.icon{border:0;background:transparent;border-radius:8px;width:32px;height:32px;color:var(--ink-2);font-size:18px;line-height:1;flex:none}
.icon:hover{background:var(--surface-2);color:var(--ink)}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:2px}
.tabs button{border:0;background:transparent;padding:9px 12px;border-bottom:2px solid transparent;color:var(--ink-2);margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--c,var(--brand));font-weight:600}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-bottom:8px}
.primary{background:var(--brand);color:var(--brand-ink);border:0;border-radius:8px;padding:8px 14px;font-weight:600}
.primary:hover{filter:brightness(1.07)}
.tools select,.tools input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;height:36px}
.tools input{width:170px}

.group{margin-bottom:28px}
.ghead{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.caret{border:0;background:transparent;color:var(--g);width:26px;height:26px;border-radius:6px;transition:transform .15s}
.caret.closed{transform:rotate(-90deg)}
.gname{font-weight:650;font-size:17px;color:var(--g);border:1px solid transparent;background:transparent;border-radius:6px;padding:2px 6px;min-width:0;width:min(360px,60vw)}
.gname:hover{border-color:var(--line)}
.gname:focus{border-color:var(--g);outline:none;background:var(--surface)}
.gcount{color:var(--ink-3);font-size:13px;white-space:nowrap}
.tw{overflow-x:auto;border-radius:8px}
table.grid{table-layout:fixed;border-collapse:separate;border-spacing:0;width:100%;min-width:720px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--g);border-radius:8px}
.grid th{font-weight:500;font-size:13px;color:var(--ink-2);text-align:center;padding:8px 6px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);white-space:nowrap}
.grid th.c-name{text-align:left;padding-left:12px;border-left:0;width:40%}
.grid th.c-who{width:13%}.grid th.c-st{width:16%}.grid th.c-due{width:16%}.grid th.c-pr{width:15%}
.grid td{border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:0;height:42px;text-align:center;vertical-align:middle}
.grid td.c-name{border-left:0;text-align:left}
.grid tbody tr:hover td{background:var(--surface-2)}
.grid tbody tr:hover td.c-st{background:transparent}
.namecell{display:flex;align-items:center;gap:4px;padding-right:6px}
.iname{flex:1;min-width:0;border:1px solid transparent;background:transparent;padding:6px 10px;border-radius:6px}
.iname:focus{border-color:var(--brand);outline:none;background:var(--surface)}
.open{border:1px solid var(--line);background:var(--surface);border-radius:6px;font-size:12px;padding:3px 8px;color:var(--ink-2);opacity:0}
tr:hover .open,.open:focus-visible{opacity:1}
.who{border:0;background:transparent;width:100%;height:42px;display:flex;align-items:center;justify-content:center}
.pill{border:0;width:100%;height:41px;font-weight:600;font-size:14px;display:block}
.st-todo{background:var(--st-todo);color:var(--st-todo-ink)}
.st-doing{background:var(--st-doing);color:var(--st-doing-ink)}
.st-stuck{background:var(--st-stuck);color:var(--st-stuck-ink)}
.st-done{background:var(--st-done);color:var(--st-done-ink)}
.pill:hover{filter:brightness(1.05)}
.due{border:0;background:transparent;padding:6px;width:100%;height:42px;text-align:center;color:var(--ink)}
.due.late{color:var(--late);font-weight:600}
.due:not([value]),.due[value=""]{color:var(--ink-3)}
.prio{border:0;background:transparent;width:100%;height:42px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--ink-2);font-size:14px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.p-low{background:#9AA6B2}.p-mid{background:#1B75BC}.p-high{background:#FBB03F}.p-urgent{background:#ED1C24}
.add-row{width:100%;border:0;background:transparent;padding:10px 12px;color:var(--ink)}
.add-row::placeholder{color:var(--ink-3)}
.add-row:focus{outline:none;background:var(--surface-2)}
.grid tfoot td{border-bottom:0;text-align:left}
.dist{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:8px;max-width:340px;margin-left:auto;background:var(--line)}
.dist span{display:block;height:100%}
.add-group{display:block;margin-top:4px}

.av{width:28px;height:28px;border-radius:50%;background:var(--av,#6D6F71);color:#fff;font-size:12px;font-weight:600;display:inline-grid;place-items:center;flex:none;letter-spacing:.02em}
.av.none{background:transparent;border:1.5px dashed var(--ink-3)}
.av.sm{width:22px;height:22px;font-size:10px}

.kanban{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:14px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:240px}
.col.over{outline:2px dashed var(--brand);outline-offset:-4px}
.day.over{outline:2px dashed var(--brand);outline-offset:-3px;background:var(--surface-2)}
.chip[draggable=true]{cursor:grab}
.chip.dragging{opacity:.4}
.colhead{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;font-weight:600;border-radius:9px 9px 0 0}
.cards{display:flex;flex-direction:column;gap:8px;padding:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:grab;text-align:left}
.card:hover{border-color:var(--brand)}
.card .cname{font-weight:500;margin-bottom:8px}
.cmeta{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.cgroup{font-size:12px;color:var(--g);margin-top:6px;font-weight:600}
.late-t{color:var(--late);font-weight:600}
.col .add-row{border-top:1px solid var(--line);margin-top:auto;border-radius:0 0 10px 10px}

.calhead{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.calhead h3{margin:0 8px;font-size:18px;font-weight:600;min-width:170px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px}
.btn:hover{border-color:var(--brand)}
.calwrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(100px,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--line);gap:1px;min-width:720px}
.dow{background:var(--surface-2);padding:6px 8px;font-size:13px;color:var(--ink-2)}
.day{background:var(--surface);min-height:104px;padding:6px;display:flex;flex-direction:column;gap:4px;position:relative}
.day.out{background:var(--surface-2)}
.day.out .dn{color:var(--ink-3)}
.dn{font-size:13px;font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;align-items:center}
.day.today .dn b{background:var(--brand);color:#fff;border-radius:10px;padding:0 7px}
.dn b{font-weight:600}
.dadd{border:0;background:transparent;color:var(--ink-3);width:22px;height:22px;border-radius:6px;opacity:0}
.day:hover .dadd,.dadd:focus-visible{opacity:1}
.dadd:hover{background:var(--surface-2);color:var(--ink)}
.chip{border:0;border-radius:5px;padding:3px 6px;font-size:12px;font-weight:600;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nodue{margin-top:12px;color:var(--ink-2);font-size:14px}

.sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.panel h3{margin:0 0 12px;font-size:16px;font-weight:600}
.panel.wide{grid-column:1/-1}
.bigbar{display:flex;height:40px;border-radius:8px;overflow:hidden;background:var(--line)}
.bigbar span{display:grid;place-items:center;font-weight:700;font-size:14px;min-width:0;overflow:hidden}
.legend{display:flex;flex-wrap:wrap;gap:18px;margin-top:12px;font-size:14px;color:var(--ink-2)}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums;margin-left:4px}
.lsq{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:0}
.list{list-style:none;margin:0;padding:0}
.list li button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
.list li:last-child button{border-bottom:0}
.list li button:hover{background:var(--surface-2)}
.list .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{color:var(--ink-3)}
.ptable{width:100%;border-collapse:collapse;font-size:14px}
.ptable th{text-align:right;font-weight:500;color:var(--ink-2);padding:6px 8px;border-bottom:1px solid var(--line)}
.ptable th:first-child,.ptable td:first-child{text-align:left}
.ptable td{padding:8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.ptable td:first-child{display:flex;align-items:center;gap:8px}

.scrim{position:fixed;inset:0;background:rgba(10,20,30,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);z-index:41;box-shadow:var(--shadow);padding:calc(18px + env(safe-area-inset-top,0px)) 22px calc(22px + env(safe-area-inset-bottom,0px));overflow-y:auto;display:flex;flex-direction:column;gap:16px;animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
.dhead{display:flex;gap:8px;align-items:flex-start}
.dname{flex:1;font-size:20px;font-weight:650;border:1px solid transparent;background:transparent;border-radius:8px;padding:4px 8px;margin-left:-9px;min-width:0}
.dname:hover{border-color:var(--line)}
.dname:focus{border-color:var(--brand);outline:none}
.field{display:flex;flex-direction:column;gap:6px}
.field>span,.field>label{font-size:13px;color:var(--ink-2)}
.field select,.field input,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%}
.field textarea{resize:vertical;min-height:120px;line-height:1.5}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;display:flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{border-color:transparent;font-weight:600}
.seg .sbtn[aria-pressed="false"]{background:var(--surface);color:var(--ink)}
.seg .sbtn.st-todo[aria-pressed="true"]{background:var(--st-todo);color:var(--st-todo-ink)}.seg .sbtn.st-doing[aria-pressed="true"]{background:var(--st-doing);color:var(--st-doing-ink)}.seg .sbtn.st-stuck[aria-pressed="true"]{background:var(--st-stuck);color:var(--st-stuck-ink)}.seg .sbtn.st-done[aria-pressed="true"]{background:var(--st-done);color:var(--st-done-ink)}
.seg .pbtn[aria-pressed="true"]{border-color:var(--ink-2)}
.meta{font-size:13px;color:var(--ink-3);margin:0}
.danger{border:1px solid var(--line);background:transparent;color:var(--late);border-radius:8px;padding:8px 12px;align-self:flex-start}
.danger.armed{background:var(--late);color:#fff;border-color:var(--late)}

.pop{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:180px;display:flex;flex-direction:column;gap:3px}
.pop[hidden]{display:none}
.pop .opt{border:0;border-radius:6px;padding:8px 10px;text-align:left;display:flex;align-items:center;gap:8px;background:transparent}
.pop .opt:hover{background:var(--surface-2)}
.pop .opt.st{justify-content:center;font-weight:600}
.pop .opt.st-todo{background:var(--st-todo);color:var(--st-todo-ink)}.pop .opt.st-doing{background:var(--st-doing);color:var(--st-doing-ink)}.pop .opt.st-stuck{background:var(--st-stuck);color:var(--st-stuck-ink)}.pop .opt.st-done{background:var(--st-done);color:var(--st-done-ink)}
.pop .opt.st:hover{filter:brightness(1.06)}
.pop hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.swatches{display:flex;gap:6px;padding:6px}
.swatches button{width:24px;height:24px;border-radius:6px;border:2px solid transparent}
.swatches button[aria-pressed="true"]{border-color:var(--ink)}
.pop .opt.del{color:var(--late)}
.pop .opt.del.armed{background:var(--late);color:#fff}

.banner{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 20px;font-size:14px;color:var(--ink-2)}
.banner b{color:var(--ink)}
.banner.err{background:#FDECEA;border-bottom-color:#F3B8B1;color:#5F1A14;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.banner.err b{color:#8C1D12}
.banner.err .btn{margin-left:auto}
.add-row[data-busy]{opacity:.6}
.empty{max-width:460px;margin:12vh auto 0;text-align:left}
.empty h1{font-size:28px;letter-spacing:-.02em;margin:0 0 8px}
.empty p{color:var(--ink-2);margin:0 0 18px}
.empty form{display:flex;gap:8px}
.empty input{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px}
.loading{padding:40vh 0;text-align:center;color:var(--ink-3)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:80;max-width:90vw}
.toast[hidden]{display:none}
[disabled]{cursor:not-allowed}

/* ---------- v4: o meu trabalho, checklist, comentários, anexos, anular ---------- */
.my-link svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;flex:none;color:var(--brand)}
.boards .my-link{margin-bottom:8px}
.bc.hot{background:var(--late);color:#fff;border-radius:9px;padding:0 6px;font-weight:600}
.bdgs{display:inline-flex;gap:6px;align-items:center;flex:none;color:var(--ink-3);font-size:12px;font-variant-numeric:tabular-nums}
.bdg{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.bdg svg,.hint svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;flex:none}
.bdg.full{color:#4C8A1C}
.cmeta .bdgs{margin-left:auto}
.grip{cursor:grab;color:var(--ink-3);font-size:12px;letter-spacing:-2px;padding:6px 2px 6px 6px;opacity:0;user-select:none;-webkit-user-select:none}
tr:hover .grip{opacity:1}
tr.dragging{opacity:.45}
tr.drop-before td{box-shadow:inset 0 2px 0 var(--brand)}
tr.drop-after td{box-shadow:inset 0 -2px 0 var(--brand)}
.group.drop-end .tw{outline:2px dashed var(--brand);outline-offset:2px}
.mtitle{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:0}
.mbar{border-bottom:1px solid var(--line)}
.msub{margin:0 0 8px;font-size:14px}
.mgroup{margin-bottom:22px}
.mgroup h3{font-size:16px;margin:0 0 8px;display:flex;gap:8px;align-items:baseline}
.mgroup.late h3{color:var(--late)}
.mgroup.today h3{color:var(--brand)}
.mlist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mrow{display:grid;grid-template-columns:118px minmax(0,1fr) auto auto 64px;gap:12px;align-items:center;padding:6px 12px 6px 6px;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .pill{height:32px;border-radius:16px;font-size:13px}
.mname{border:0;background:transparent;text-align:left;display:flex;gap:10px;align-items:center;min-width:0;padding:6px 0;color:var(--ink)}
.mname>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.mname:hover>span:first-child{text-decoration:underline}
.mboard{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}

const itemsPath=k=>`/sites/${siteId}/lists/${listIds[k]}/items`;
function toFields(map,p){const o={};for(const k in p){if(!(k in map))continue;const col=map[k];if(colMissing.has(col))continue;let v=p[k];
  if(k==="groups"||k==="checklist")v=JSON.stringify(v||[]);else if(k==="order"||k==="files")v=colNum[col]===false?String(Number(v)||0):(Number(v)||0);else v=v==null?"":String(v);
  o[colMap[col]||col]=v;}return o;}
const F=(f,n)=>f[colMap[n]||n];
function parseJSON(s,d){try{return s?JSON.parse(s):d;}catch(e){return d;}}
function who(x){return(x.createdBy&&x.createdBy.user&&x.createdBy.user.displayName)||"";}
function boardFrom(x){const f=x.fields||{};return{id:x.id,name:f.Title||"Sem nome",color:F(f,"Color")||PALETTE[0],groups:parseJSON(F(f,"Groups"),[]),createdAt:Date.parse(x.createdDateTime)||0,createdByName:who(x)};}
function itemFrom(x){const f=x.fields||{};const cl=parseJSON(F(f,"Checklist"),[]);return{id:x.id,boardId:String(F(f,"BoardId")||""),groupId:F(f,"GroupId")||"",name:f.Title||"",status:F(f,"Status")||"todo",owner:String(F(f,"OwnerEmail")||"").toLowerCase(),due:F(f,"Due")||"",prio:F(f,"Prio")||"",notes:F(f,"Notes")||"",order:Number(F(f,"SortOrder"))||0,
  recur:F(f,"Recur")||"",checklist:Array.isArray(cl)?cl:[],files:Number(F(f,"FilesCount"))||0,createdAt:Date.parse(x.createdDateTime)||0,createdByName:who(x)};}
function commentFrom(x){const f=x.fields||{};return{id:x.id,itemId:String(F(f,"ItemId")||""),body:F(f,"Body")||"",author:String(F(f,"AuthorEmail")||"").toLowerCase(),authorName:who(x),createdAt:Date.parse(x.createdDateTime)||0};}
function colorFor(e){let h=0;for(const c of String(e))h=(h*31+c.charCodeAt(0))>>>0;return AVC[h%AVC.length];}

/* ---------- arranque ---------- */
async function init(){
  if(window.opener&&window.opener!==window&&/(code|error)=/.test(location.hash)){$("#app").innerHTML=`<div class="loading">A concluir o login…</div>`;return;}
  if(!window.msal){fail("Não foi possível carregar o login da Microsoft. Verifique a ligação à internet e recarregue a página.");return;}
  msalApp=new msal.PublicClientApplication({auth:{clientId:CONFIG.clientId,authority:CONFIG.authority,redirectUri:location.origin+location.pathname},cache:{cacheLocation:"localStorage"}});
  try{const r=await msalApp.handleRedirectPromise();if(r&&r.account)account=r.account;}
  catch(e){fail("O login falhou: "+e.message);return;}
  account=account||msalApp.getAllAccounts()[0]||null;
  if(!account){S.mode="signin";render();return;}
  msalApp.setActiveAccount(account);
  S.me=(account.username||"").toLowerCase();S.names[S.me]=account.name||S.me;S.colors[S.me]=colorFor(S.me);
  S.mode="loading";render();
  try{await connect();stage="data";await refresh(true);S.mode="ready";S.loaded=true;fixBoard();render();
    setInterval(()=>{if(document.visibilityState==="visible")refresh().catch(()=>{});},CONFIG.refreshMs);
    addEventListener("focus",()=>refresh().catch(()=>{}));
    document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")refresh().catch(()=>{});else flushUndo();});
    addEventListener("pagehide",flushUndo);
  }catch(e){fail(explain(e));}
}
async function connect(){
  stage="site";
  siteId=(await graph("GET","/sites/"+CONFIG.sitePath+"?$select=id")).id;
  stage="lists";
  const lists=await graphAll(`/sites/${siteId}/lists?$select=id,displayName`);
  for(const k of Object.keys(CONFIG.lists)){
    const opt=CONFIG.optional.includes(k);
    const f=lists.find(l=>l.displayName===CONFIG.lists[k]);
    if(f){listIds[k]=f.id;}
    else{
      stage="create";
      try{listIds[k]=(await graph("POST",`/sites/${siteId}/lists`,{displayName:CONFIG.lists[k],columns:LIST_DEF[k],list:{template:"genericList"}})).id;await sleep(1500);}
      catch(e){if(!opt)throw e;console.warn("Quadros: lista opcional não criada",k,e);continue;}
    }
    if(opt)S.feat[k]=true;
  }
  stage="columns";
  for(const k of Object.keys(listIds))await checkColumns(k);
  stage="library";
  try{
    let lib=lists.find(l=>l.displayName===CONFIG.library);
    if(!lib){lib=await graph("POST",`/sites/${siteId}/lists`,{displayName:CONFIG.library,list:{template:"documentLibrary"}});await sleep(1500);}
    driveId=(await graph("GET",`/sites/${siteId}/lists/${lib.id}/drive?$select=id`)).id;S.feat.files=true;
  }catch(e){console.warn("Quadros: biblioteca de anexos indisponível",e);}
  stage="people";
  const ppl=await readList("people");
  if(!ppl.some(p=>String(F(p.fields||{},"Email")||"").toLowerCase()===S.me)){
    try{await graph("POST",itemsPath("people"),{fields:{Title:S.names[S.me],[colMap.Email||"Email"]:S.me}});}catch(e){if(e.status!==403)throw e;}
  }
}
async function checkColumns(k){
  let cols=await graphAll(`/sites/${siteId}/lists/${listIds[k]}/columns?$select=name,displayName,number,text`);
  for(const def of LIST_DEF[k]){
    let c=cols.find(x=>x.name===def.name)||cols.find(x=>x.displayName===def.name);
    if(!c){try{c=await graph("POST",`/sites/${siteId}/lists/${listIds[k]}/columns`,def);}catch(e){console.error("Quadros: coluna em falta",def.name,e);colMissing.add(def.name);continue;}}
    colMap[def.name]=c.name;colNum[def.name]=!!c.number;colMissing.delete(def.name);
  }
}
function explain(e){
  if(e.status===404&&stage==="site")return`Não encontrei o site SharePoint ${CONFIG.sitePath.replace(":","")}. Confirme que o site existe e que o endereço no topo do ficheiro está certo.`;
  if(e.status===403&&stage==="create")return"As listas da app ainda não existem e esta conta não as pode criar. O primeiro acesso deve ser feito por um administrador do site.";
  if(e.status===403||e.status===401)return"Esta conta não tem acesso ao site Quadros, ou as permissões da app ainda não foram autorizadas no Entra ID.";
  return"Erro ao ligar ao SharePoint: "+e.message;
}
function fail(msg){S.mode="error";S.error=msg;render();}
async function refresh(first){
  if(refreshing||(!first&&inflight>0))return;
  refreshing=true;const g=gen;
  try{
    const[bs,is,ps,cs]=await Promise.all([readList("boards"),readList("items"),readList("people"),S.feat.comments?readList("comments").catch(()=>null):null]);
    if(!first&&(inflight>0||gen!==g))return;
    const boards={},items={};
    bs.forEach(x=>{const b=boardFrom(x);boards[b.id]=b;});
    is.forEach(x=>{const i=itemFrom(x);items[i.id]=i;});
    S.boards=boards;S.items=items;S.people=[];
    if(cs){const c={};cs.forEach(x=>{const o=commentFrom(x);c[o.id]=o;});S.comments=c;}
    ps.forEach(x=>{const f=x.fields||{};const e=String(F(f,"Email")||"").toLowerCase();if(!e)return;S.people.push(e);S.names[e]=f.Title||e;S.colors[e]=colorFor(e);});
    if(!first){fixBoard();schedule();}
  }finally{refreshing=false;}
}

/* ---------- gravação ---------- */
const queues={};
function q(key,fn){
  inflight++;gen++;
  const p=(queues[key]||Promise.resolve()).then(fn).catch(writeErr).finally(()=>{inflight--;});
  queues[key]=p;return p;
}
function writeErr(e){
  if(e.status===403){S.readOnly=true;toast("Esta conta não tem permissão para alterar o site Quadros.");render();}
  else if(e.status===401)toast("A sessão expirou. Recarregue a página para voltar a entrar.");
  else{S.saveErr=e.message||"erro desconhecido";toast("Não foi possível guardar no SharePoint: "+S.saveErr,10000);schedule();}
  console.error("Quadros: erro ao gravar",e);
  setTimeout(()=>refresh().catch(()=>{}),500);
}
const ok404=p=>p.catch(e=>{if(e.status!==404)throw e;});
function guard(){if(S.readOnly){toast("Só tem acesso de leitura.");return false;}return true;}
function patchBoard(id,p){const b=S.boards[id];if(!b)return;S.boards[id]={...b,...p};q("b"+id,()=>graph("PATCH",`${itemsPath("boards")}/${id}/fields`,toFields(BOARD_F,p)));}
function patchItem(id,p){const i=S.items[id];if(!i)return;S.items[id]={...i,...p};const body=toFields(ITEM_F,p);if(!Object.keys(body).length)return;q("i"+id,()=>graph("PATCH",`${itemsPath("items")}/${id}/fields`,body));}
async function createSP(k,map,obj){
  inflight++;gen++;
  try{const r=await graph("POST",itemsPath(k),{fields:toFields(map,obj)});return{...obj,id:r.id,createdAt:Date.now(),createdByName:S.names[S.me]};}
  catch(e){writeErr(e);return null;}
  finally{inflight--;}
}
/* grupos: lê a versão mais recente do quadro, aplica a alteração e grava com If-Match */
function remoteGroups(bid,fn){
  q("b"+bid,async()=>{
    for(let n=0;n<4;n++){
      const x=await graph("GET",`${itemsPath("boards")}/${bid}?$expand=fields`);
      const ng=fn(parseJSON(F(x.fields||{},"Groups"),[]).map(g=>({...g})));
      const body=toFields(BOARD_F,{groups:ng});const tag=x.eTag||x["@odata.etag"];
      try{await graph("PATCH",`${itemsPath("boards")}/${bid}/fields`,body,tag?{"If-Match":tag}:undefined);}
      catch(e){
        if(e.status===412&&n<3)continue;
        if(tag&&e.status===400){await graph("PATCH",`${itemsPath("boards")}/${bid}/fields`,body);}
        else throw e;
      }
      if(S.boards[bid]){S.boards[bid]={...S.boards[bid],groups:ng};schedule();}
      return;
    }
  });
}
function setGroups(fn){const b=S.boards[S.boardId];if(!b||!guard())return;S.boards[b.id]={...b,groups:fn((b.groups||[]).map(g=>({...g})))};remoteGroups(b.id,fn);}

/* apagar com "Anular" */
let undoRec=null;
function withUndo(msg,{apply,undo,commit}){
  flushUndo();apply();inflight++;gen++;
  const rec={undo,commit,done:false};rec.t=setTimeout(()=>finishUndo(rec,true),6000);undoRec=rec;
  render();toast(msg,6000,{label:"Anular",fn:()=>finishUndo(rec,false)});
}
function finishUndo(rec,commit){
  if(rec.done)return;rec.done=true;clearTimeout(rec.t);if(undoRec===rec)undoRec=null;inflight--;
  if(commit)rec.commit();else{rec.undo();gen++;render();toast("Anulado.");}
}
function flushUndo(){if(undoRec)finishUndo(undoRec,true);}
function commitItemDelete(id){
  q("i"+id,()=>ok404(graph("DELETE",`${itemsPath("items")}/${id}`)));
  Object.values(S.comments).filter(c=>c.itemId===id).forEach(c=>{delete S.comments[c.id];q("c"+c.id,()=>ok404(graph("DELETE",`${itemsPath("comments")}/${c.id}`)));});
  if(S.feat.files)q("f"+id,()=>ok404(graph("DELETE",`/drives/${driveId}/root:/${id}`)));
}
function deleteItems(ids,msg,extra){
  const saved=ids.map(id=>S.items[id]).filter(Boolean);
  withUndo(msg,{
    apply:()=>{saved.forEach(i=>delete S.items[i.id]);if(ids.includes(S.open))S.open=null;extra&&extra.apply();},
    undo:()=>{saved.forEach(i=>S.items[i.id]=i);extra&&extra.undo();},
    commit:()=>{saved.forEach(i=>commitItemDelete(i.id));extra&&extra.commit();}
  });
}

function sortedBoards(){return Object.values(S.boards).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));}
function fixBoard(){if(!S.boards[S.boardId]){const b=sortedBoards()[0];S.boardId=b?b.id:null;}}
function peopleList(){const l=[S.me,...S.people].filter(Boolean);return[...new Set(l)];}
function nameOf(id){return S.names[id]||"Alguém";}
function initials(n){const p=String(n).trim().split(/\s+/);return((p[0]||"?")[0]+(p.length>1?p[p.length-1][0]:"")).toUpperCase();}
function avatar(id,cls){
  if(!id)return`<span class="av none ${cls||""}" title="Sem responsável"></span>`;
  return`<span class="av ${cls||""}" style="--av:${esc(S.colors[id]||"#6D6F71")}" title="${esc(nameOf(id))}">${esc(initials(nameOf(id)))}</span>`;
}
function byPerson(i,p){return p==="all"?true:p==="me"?i.owner===S.me:p==="none"?!i.owner:i.owner===p;}
function visible(boardId){
  const q=S.q.trim().toLowerCase();
  return Object.values(S.items).filter(i=>i.boardId===boardId)
    .filter(i=>byPerson(i,S.person))
    .filter(i=>!q||String(i.name).toLowerCase().includes(q)||String(i.notes||"").toLowerCase().includes(q))
    .sort((a,b)=>(a.order||0)-(b.order||0));
}
const commentsOf=id=>Object.values(S.comments).filter(c=>c.itemId===id).sort((a,b)=>a.createdAt-b.createdAt);

/* ---------- repetição ---------- */
function recLabel(r){const c=(r||"").split("@")[0];const o=RECUR.find(x=>x[0]===c);return o?o[1]:"";}
function withAnchor(code,due){return code&&/^[my]/.test(code)&&due?code+"@"+pdate(due).getDate():code;}
function nextDue(due,rec){
  const[c,a]=String(rec).split("@");const unit=c[0],n=+c.slice(1)||1;
  const base=due?pdate(due):pdate(today());const anchor=+a||base.getDate();
  const step=d=>{if(unit==="w")return new Date(d.getFullYear(),d.getMonth(),d.getDate()+7*n);
    const m=d.getMonth()+(unit==="y"?12*n:n);const last=new Date(d.getFullYear(),m+1,0).getDate();return new Date(d.getFullYear(),m,Math.min(anchor,last));};
  let d=step(base);const t=today();for(let k=0;dstr(d)<t&&k<600;k++)d=step(d);
  return dstr(d);
}
function setStatus(id,v){
  const i=S.items[id];if(!i||!guard())return;
  if(v==="done"&&i.status!=="done"&&i.recur){
    const due=nextDue(i.due,i.recur);
    patchItem(id,{status:"done",recur:""});
    createSP("items",ITEM_F,{boardId:i.boardId,groupId:i.groupId,name:i.name,status:"todo",owner:i.owner,due,prio:i.prio,notes:i.notes,order:i.order+0.5,recur:i.recur,
      checklist:(i.checklist||[]).map(c=>({...c,d:false})),files:0}).then(it=>{if(it){S.items[it.id]=it;schedule();toast("Feito. Próxima vez criada para "+fmtDate(due)+".",5000);}});
  }else patchItem(id,{status:v});
}

/* ---------- anexos ---------- */
const safeName=n=>String(n||"ficheiro").replace(/[\\/:*?"<>|#%]/g,"_").replace(/^[\s.]+|[\s.]+$/g,"")||"ficheiro";
async function loadFiles(id){
  if(!S.feat.files)return;
  S.files[id]={...(S.files[id]||{}),loading:true};drawFiles(id);
  try{
    const r=await graph("GET",`/drives/${driveId}/root:/${id}:/children?$expand=thumbnails&$top=200`);
    S.files[id]={list:(r.value||[]).filter(f=>f.file).map(f=>({id:f.id,name:f.name,size:f.size||0,url:f.webUrl,img:/^image\//.test(f.file.mimeType||""),thumb:f.thumbnails&&f.thumbnails[0]&&f.thumbnails[0].small&&f.thumbnails[0].small.url}))};
  }catch(e){S.files[id]=e.status===404?{list:[]}:{list:[],err:e.message};}
  drawFiles(id);syncFilesCount(id);
}
function syncFilesCount(id){const i=S.items[id],f=S.files[id];if(i&&f&&!f.err&&!f.loading&&i.files!==f.list.length&&!S.readOnly)patchItem(id,{files:f.list.length});}
async function ensureFolder(id){
  try{await graph("POST",`/drives/${driveId}/root/children`,{name:id,folder:{},"@microsoft.graph.conflictBehavior":"fail"});}
  catch(e){if(e.status!==409)throw e;}
}
async function putFile(id,f){
  const path=`/drives/${driveId}/root:/${id}/${encodeURIComponent(safeName(f.name))}`;
  if(f.size<=4*1024*1024)return graphRaw("PUT",path+":/content?@microsoft.graph.conflictBehavior=rename",f,{"Content-Type":f.type||"application/octet-stream"});
  const s=await graph("POST",path+":/createUploadSession",{item:{"@microsoft.graph.conflictBehavior":"rename"}});
  const CH=320*1024*16;
  for(let o=0;o<f.size;o+=CH){
    const end=Math.min(o+CH,f.size);
    const r=await fetch(s.uploadUrl,{method:"PUT",headers:{"Content-Range":`bytes ${o}-${end-1}/${f.size}`},body:f.slice(o,end)});
    if(!r.ok){const err=new Error("HTTP "+r.status);err.status=r.status;throw err;}
  }
}
async function uploadFiles(id,files){
  if(!files.length||!guard())return;
  const errs=[];inflight++;gen++;
  try{
    await ensureFolder(id);
    for(let k=0;k<files.length;k++){
      S.files[id]={...(S.files[id]||{list:[]}),busy:`A carregar ${k+1} de ${files.length}…`};drawFiles(id);
      try{await putFile(id,files[k]);}catch(e){errs.push(files[k].name+": "+e.message);}
    }
  }catch(e){errs.push(e.message);}
  finally{inflight--;}
  if(S.files[id])delete S.files[id].busy;
  await loadFiles(id);
  if(errs.length){S.saveErr="anexos não carregados: "+errs.join("; ");schedule();}
}
async function delFile(id,fid){
  if(!guard())return;inflight++;gen++;
  try{await ok404(graph("DELETE",`/drives/${driveId}/items/${fid}`));}catch(e){writeErr(e);}finally{inflight--;}
  await loadFiles(id);
}
function filesHtml(id){
  const f=S.files[id];
  if(!f||f.loading&&!f.list)return`<p class="muted small">A carregar…</p>`;
  const list=(f.list||[]).map(x=>`<li><a href="${esc(x.url)}" target="_blank" rel="noopener" class="fname">${x.img&&x.thumb?`<img src="${esc(x.thumb)}" alt="" loading="lazy" onerror="this.replaceWith(document.createRange().createContextualFragment(this.dataset.f))" data-f="${esc(ICON.file)}">`:ICON.file}<span>${esc(x.name)}</span></a><span class="fsize">${fmtSize(x.size)}</span>${S.readOnly?"":`<button class="icon sm" data-act="del-file" data-id="${id}" data-fid="${esc(x.id)}" aria-label="Apagar ${esc(x.name)}">✕</button>`}</li>`).join("");
  return(list?`<ul class="files">${list}</ul>`:`<p class="muted small">Sem anexos.</p>`)+(f.busy?`<p class="small">${esc(f.busy)}</p>`:"")+(f.err?`<p class="small late-t">Não foi possível ler os anexos: ${esc(f.err)}</p>`:"");
}
function drawFiles(id){const el=$("#dfiles");if(el&&el.dataset.id===id)el.innerHTML=filesHtml(id);}

/* ---------- render ---------- */
function editing(){const a=document.activeElement;return a&&a.matches&&a.matches("input:not([type=date]):not([type=file]):not([type=checkbox]),textarea,select")&&!a.matches(".search");}
function schedule(){if(editing()){pending=true;return;}render();}
document.addEventListener("focusout",e=>{const t=e.target;if(t&&t.dataset&&t.dataset.act==="add-row")addFromRow(t,false);});
document.addEventListener("focusout",e=>{const to=e.relatedTarget;setTimeout(()=>{if(pending&&!editing()&&!(to&&to.closest&&to.closest("button,[data-act]")))render();},0);});

function render(){
  pending=false;closePop();
  const app=$("#app");
  if(S.mode==="signin"){app.innerHTML=`<div class="empty"><div class="brand" style="padding:0;margin-bottom:28px"><span class="mark" aria-hidden="true">${PALETTE.slice(0,4).map(c=>`<i style="background:${c}"></i>`).join("")}</span>Quadros</div><h1>Entrar</h1><p>Use a sua conta Microsoft da Ventask para ver e editar os quadros partilhados.</p><button class="primary" data-act="sign-in">Entrar com Microsoft</button></div>`;$("#drawer").innerHTML="";return;}
  if(S.mode==="error"){app.innerHTML=`<div class="empty"><h1>Não foi possível ligar</h1><p>${esc(S.error)}</p><div style="display:flex;gap:8px"><button class="primary" data-act="retry">Tentar de novo</button>${account?`<button class="btn" data-act="sign-out">Sair</button>`:""}</div></div>`;$("#drawer").innerHTML="";return;}
  if(!S.loaded){app.innerHTML=`<div class="loading">A ligar ao SharePoint…</div>`;$("#drawer").innerHTML="";return;}
  const b=S.boards[S.boardId];
  const main=S.page==="my"?myWork():b?boardView(b):emptyView();
  const keep={};["#d-comment",".cladd"].forEach(s=>{const el=$(s);if(el&&el.value)keep[s]=el.value;});const fid=document.activeElement&&(document.activeElement.id==="d-comment"?"#d-comment":document.activeElement.classList&&document.activeElement.classList.contains("cladd")?".cladd":null);
  app.innerHTML=banner()+`<div class="layout"><aside class="side">${side()}</aside><main class="main">${main}</main></div>`;
  const it=S.open&&S.items[S.open];
  $("#drawer").innerHTML=it?drawer(it):"";
  if(it&&S.feat.files&&!S.files[it.id])loadFiles(it.id);
  for(const s in keep){const el=$(s);if(el)el.value=keep[s];}
  if(fid){const el=$(fid);el&&el.focus();}
  if(S.readOnly)document.querySelectorAll("#app input:not(.search),#app select:not(.pf),#app textarea,#drawer input,#drawer select,#drawer textarea").forEach(el=>el.disabled=true);
}
function renderView(){const b=S.boards[S.boardId];const v=$(".view");if(b&&v)v.innerHTML=viewHtml(b);}
function banner(){
  if(S.readOnly)return`<div class="banner"><b>Só leitura.</b> Esta conta não tem permissão de edição no site Quadros.</div>`;
  if(S.saveErr)return`<div class="banner err"><b>Uma alteração não ficou gravada.</b> O SharePoint respondeu: ${esc(S.saveErr)} <button class="btn" data-act="dismiss-err">Fechar</button></div>`;
  return"";
}
function myCount(){const t=today();return Object.values(S.items).filter(i=>S.boards[i.boardId]&&i.owner===S.me&&i.status!=="done"&&i.due&&i.due<=t).length;}
function side(){
  const marks=PALETTE.slice(0,4).map(c=>`<i style="background:${c}"></i>`).join("");
  const links=sortedBoards().map(b=>{
    const open=Object.values(S.items).filter(i=>i.boardId===b.id&&i.status!=="done").length;
    return`<button class="board-link" data-act="board" data-id="${b.id}" style="--c:${esc(b.color)}" aria-current="${S.page!=="my"&&b.id===S.boardId}"><span class="sw"></span><span class="bn">${esc(b.name)}</span><span class="bc">${open||""}</span></button>`;
  }).join("");
  const mc=myCount();

function calendar(b){

  const t=today();let html="";
  let sel=S.calSel;if(!sel||+sel.slice(0,4)!==y||+sel.slice(5,7)!==m+1)sel=(t.slice(0,7)===y+"-"+pad(m+1))?t:dstr(first);

      ${di.length?`<span class="ddots" aria-hidden="true">${di.slice(0,3).map(i=>`<i class="st-${i.status||"todo"}"></i>`).join("")}${di.length>3?`<em>+${di.length-3}</em>`:""}</span>`:""}</div>`;
  }
  const nd=items.filter(i=>!i.due&&i.status!=="done").length;
  const sdate=pdate(sel);
  const si=items.filter(i=>i.due===sel);
  const dayList=`<section class="daylist" aria-label="Itens do dia selecionado"><h4>${WEEKDAY[sdate.getDay()]}, ${sdate.getDate()} de ${MONTHS[sdate.getMonth()]}</h4>

  return`<div class="calhead"><button class="btn" data-act="cal-prev" aria-label="Mês anterior">‹</button><button class="btn" data-act="cal-next" aria-label="Mês seguinte">›</button><h3>${MONTHS[m]} de ${y}</h3><button class="btn" data-act="cal-today">Hoje</button></div>
    <div class="calwrap"><div class="cal">${DOW.map(d=>`<div class="dow">${d}</div>`).join("")}${html}</div></div>
    ${dayList}
    ${nd?`<p class="nodue">${nd} ${nd===1?"item em aberto sem prazo":"itens em aberto sem prazo"}.</p>`:""}`;
}

function openPop(anchor,html){
  const p=$("#pop");p.innerHTML=html;p.hidden=false;popAnchor=anchor;
  const r=anchor.getBoundingClientRect();const w=p.offsetWidth,h=p.offsetHeight;
  let x=Math.min(r.left,innerWidth-w-8),y=r.bottom+4;if(y+h>innerHeight-8)y=Math.max(8,r.top-h-4);
  p.style.left=Math.max(8,x)+"px";p.style.top=y+"px";
  const f=p.querySelector("button");f&&f.focus();
}
function closePop(){const p=$("#pop");if(!p.hidden){p.hidden=true;p.innerHTML="";if(popAnchor&&document.contains(popAnchor))popAnchor.focus();popAnchor=null;}}

  if(!b)return;
  S.boards[b.id]=b;S.boardId=b.id;S.page="board";S.view="table";savePrefs();render();
  if(!name)requestAnimationFrame(()=>{const el=$(".btitle");el&&(el.focus(),el.select());});
}
async function addItem(groupId,name,extra){
  if(!guard())return null;
  const b=S.boards[S.boardId];if(!b)return null;
  const gid=groupId||(b.groups&&b.groups[0]&&b.groups[0].id);if(!gid){toast("Crie primeiro um grupo neste quadro.");return null;}
  const it=await createSP("items",ITEM_F,{boardId:b.id,groupId:gid,name:name||"Novo item",status:"todo",owner:"",due:"",prio:"",notes:"",order:Date.now(),recur:"",checklist:[],files:0,...(extra||{})});
  if(it)S.items[it.id]=it;return it;
}
function addFromRow(t,viaEnter){
  if(!t)return;const v=t.value.trim();if(!v)return;
  const gid=t.dataset.gid,st=t.dataset.status;const extra=st?{status:st}:{};
  const sel=st?`.add-row[data-status="${st}"]`:`.add-row[data-gid="${gid}"]`;
  const key=rowKey(t);t.value="";delete rowDraft[key];t.dataset.busy="1";
  addItem(gid,v,extra).then(it=>{
    const cur=$(sel);const focused=cur&&document.activeElement===cur;const typed=cur?cur.value:"";
    if(cur)delete cur.dataset.busy;
    if(!it){if(!(cur&&cur.value)){rowDraft[key]=v;if(cur)cur.value=v;}return;}
    if(viaEnter||focused||!editing()){render();const n=$(sel);if(n&&(viaEnter||focused)){n.value=typed;n.focus();}}
    else pending=true;
  });
}
function openNew(it){if(!it)return;S.open=it.id;render();requestAnimationFrame(()=>{const el=$(".dname");el&&(el.focus(),el.select());});}
function patchChecklist(fn){const i=S.items[S.open];if(!i||!guard())return;patchItem(i.id,{checklist:fn((i.checklist||[]).map(c=>({...c})))});}
async function addComment(){
  const ta=$("#d-comment");const i=S.items[S.open];if(!ta||!i||!guard())return;const v=ta.value.trim();if(!v)return;
  const btn=$("[data-act=add-comment]");ta.disabled=true;if(btn)btn.disabled=true;
  const c=await createSP("comments",COMMENT_F,{itemId:i.id,body:v,author:S.me});
  if(c){ta.value="";S.comments[c.id]={...c,authorName:S.names[S.me]};render();const n=$("#d-comment");n&&n.focus();}
  else{ta.disabled=false;if(btn)btn.disabled=false;}
}

const CLICK={
  "board":t=>{S.boardId=t.dataset.id;S.page="board";S.open=null;savePrefs();render();},
  "mywork":()=>{S.page="my";S.open=null;savePrefs();render();},
  "new-board":()=>createBoard(""),
  "view":t=>{S.view=t.dataset.v;savePrefs();render();},
  "new-item":async()=>openNew(await addItem()),
  "sign-in":()=>msalApp.loginRedirect({scopes:CONFIG.scopes}),
  "sign-out":()=>msalApp.logoutRedirect({account}),
  "retry":()=>location.reload(),
  "reauth":()=>doReauth(),
  "dismiss-err":()=>{S.saveErr="";render();},
  "collapse":t=>{const g=t.dataset.gid;S.collapsed[g]=!S.collapsed[g];savePrefs();render();},
  "add-group":()=>{const b=S.boards[S.boardId];const n=(b.groups||[]).length;const g={id:uid(),name:"Novo grupo",color:PALETTE[n%PALETTE.length]};setGroups(gs=>gs.some(x=>x.id===g.id)?gs:[...gs,g]);render();
    requestAnimationFrame(()=>{const els=document.querySelectorAll(".gname");const el=els[els.length-1];el&&(el.focus(),el.select());});},
  "open":t=>{S.open=t.dataset.id;render();const d=$(".drawer .icon");d&&d.focus();},
  "close-drawer":()=>{S.open=null;render();},
  "status":t=>{if(!guard())return;openPop(t,STATUS.map(s=>`<button class="opt st st-${s.id}" data-act="pick-status" data-id="${t.dataset.id}" data-v="${s.id}">${s.label}</button>`).join(""));},
  "owner":t=>{if(!guard())return;openPop(t,[...peopleList().map(id=>`<button class="opt" data-act="pick-owner" data-id="${t.dataset.id}" data-v="${esc(id)}">${avatar(id,"sm")}${esc(nameOf(id))}${id===S.me?" (eu)":""}</button>`),`<hr><button class="opt" data-act="pick-owner" data-id="${t.dataset.id}" data-v="">${avatar("","sm")}Sem responsável</button>`].join(""));},
  "prio":t=>{if(!guard())return;openPop(t,[...PRIO.map(p=>`<button class="opt" data-act="pick-prio" data-id="${t.dataset.id}" data-v="${p.id}"><span class="dot p-${p.id}"></span>${p.label}</button>`),`<hr><button class="opt" data-act="pick-prio" data-id="${t.dataset.id}" data-v="">Nenhuma</button>`].join(""));},
  "pick-status":t=>{setStatus(t.dataset.id,t.dataset.v);render();},
  "pick-owner":t=>{patchItem(t.dataset.id,{owner:t.dataset.v});render();},
  "pick-prio":t=>{patchItem(t.dataset.id,{prio:t.dataset.v});render();},
  "set-status":t=>{setStatus(S.open,t.dataset.v);render();},
  "set-prio":t=>{if(!guard())return;patchItem(S.open,{prio:t.dataset.v});render();},
  "group-menu":t=>{if(!guard())return;const b=S.boards[S.boardId];const g=(b.groups||[]).find(x=>x.id===t.dataset.gid);if(!g)return;
    const n=Object.values(S.items).filter(i=>i.boardId===b.id&&i.groupId===g.id).length;
    openPop(t,swatches("pick-gcolor",g.color,`data-gid="${g.id}"`)+`<hr><button class="opt del" data-act="del-group" data-gid="${g.id}" data-n="${n}">Apagar grupo</button>`);},
  "pick-gcolor":t=>{const gid=t.dataset.gid,v=t.dataset.v;setGroups(gs=>gs.map(g=>g.id===gid?{...g,color:v}:g));render();},
  "del-group":t=>{const n=+t.dataset.n;t.classList.add("armed");t.dataset.act="del-group-yes";t.textContent=n?`Confirmar: apagar grupo e ${n} ${n===1?"item":"itens"}`:"Confirmar: apagar grupo";},
  "del-group-yes":t=>{
    const gid=t.dataset.gid;const b=S.boards[S.boardId];if(!b)return;const bid=b.id;
    const idx=(b.groups||[]).findIndex(g=>g.id===gid);const g=b.groups[idx];
    const ids=Object.values(S.items).filter(i=>i.boardId===bid&&i.groupId===gid).map(i=>i.id);
    deleteItems(ids,"Grupo apagado.",{
      apply:()=>{S.boards[bid]={...S.boards[bid],groups:S.boards[bid].groups.filter(x=>x.id!==gid)};},
      undo:()=>{const gs=[...S.boards[bid].groups];gs.splice(idx,0,g);S.boards[bid]={...S.boards[bid],groups:gs};},
      commit:()=>remoteGroups(bid,gs=>gs.filter(x=>x.id!==gid))
    });
  },
  "board-menu":t=>{const b=S.boards[S.boardId];if(!b||!guard())return;const n=Object.values(S.items).filter(i=>i.boardId===b.id).length;
    openPop(t,swatches("pick-bcolor",b.color)+`<hr><button class="opt del" data-act="del-board" data-n="${n}">Apagar quadro</button>`);},
  "pick-bcolor":t=>{patchBoard(S.boardId,{color:t.dataset.v});render();},
  "del-board":t=>{const n=+t.dataset.n;t.classList.add("armed");t.dataset.act="del-board-yes";t.textContent=n?`Confirmar: apagar quadro e ${n} ${n===1?"item":"itens"}`:"Confirmar: apagar quadro";},
  "del-board-yes":()=>{
    const b=S.boards[S.boardId];if(!b)return;const bid=b.id;
    const ids=Object.values(S.items).filter(i=>i.boardId===bid).map(i=>i.id);
    deleteItems(ids,"Quadro apagado.",{
      apply:()=>{delete S.boards[bid];S.boardId=null;fixBoard();savePrefs();},
      undo:()=>{S.boards[bid]=b;S.boardId=bid;S.page="board";savePrefs();},
      commit:()=>q("b"+bid,()=>ok404(graph("DELETE",`${itemsPath("boards")}/${bid}`)))
    });
  },
  "del-item":t=>{const id=t.dataset.id;deleteItems([id],"Item apagado.");},
  "cal-prev":()=>{S.calM--;if(S.calM<0){S.calM=11;S.calY--;}renderView();},
  "cal-next":()=>{S.calM++;if(S.calM>11){S.calM=0;S.calY++;}renderView();},
  "cal-today":()=>{const n=new Date();S.calY=n.getFullYear();S.calM=n.getMonth();S.calSel=today();renderView();},
  "cal-day":t=>{S.calSel=t.dataset.date;const[y,m]=t.dataset.date.split("-").map(Number);if(m-1!==S.calM){S.calY=y;S.calM=m-1;}renderView();},
  "cal-add":async t=>openNew(await addItem(null,"",{due:t.dataset.date})),
  "cl-del":t=>{const cid=t.dataset.cid;patchChecklist(cl=>cl.filter(c=>c.id!==cid));render();},
  "add-comment":()=>addComment(),
  "del-comment":t=>{
    const cid=t.dataset.cid;const c=S.comments[cid];if(!c||!guard())return;
    withUndo("Comentário apagado.",{apply:()=>{delete S.comments[cid];},undo:()=>{S.comments[cid]=c;},commit:()=>q("c"+cid,()=>ok404(graph("DELETE",`${itemsPath("comments")}/${cid}`)))});
  },
  "del-file":t=>{
    if(!t.classList.contains("armed")){t.classList.add("armed");t.textContent="Apagar?";t.setAttribute("aria-label","Confirmar apagar");setTimeout(()=>{if(document.contains(t)){t.classList.remove("armed");t.textContent="✕";}},4000);return;}
    t.disabled=true;delFile(t.dataset.id,t.dataset.fid);
  }
};
const CHANGE={
  "iname":t=>{const v=t.value.trim();const i=S.items[t.dataset.id];if(!i)return;if(!v){t.value=i.name;return;}if(v!==i.name&&guard())patchItem(i.id,{name:v});},
  "btitle":t=>{const v=t.value.trim();const b=S.boards[S.boardId];if(!b)return;if(!v){t.value=b.name;return;}if(v!==b.name&&guard()){patchBoard(b.id,{name:v});pending=true;}},
  "gname":t=>{const v=t.value.trim();const gid=t.dataset.gid;const b=S.boards[S.boardId];const g=b&&(b.groups||[]).find(x=>x.id===gid);if(!g)return;if(!v){t.value=g.name;return;}if(v!==g.name)setGroups(gs=>gs.map(x=>x.id===gid?{...x,name:v}:x));},
  "due":t=>{if(!guard())return;const i=S.items[t.dataset.id];if(!i)return;const v=t.value||"";const p={due:v};
    if(i.recur&&/^[my]/.test(i.recur))p.recur=withAnchor(i.recur.split("@")[0],v);
    patchItem(i.id,p);pending=true;setTimeout(()=>{if(!editing())render();},0);},
  "set-owner":t=>{if(!guard())return;patchItem(t.dataset.id,{owner:t.value});pending=true;},
  "set-group":t=>{if(!guard())return;patchItem(t.dataset.id,{groupId:t.value});pending=true;},
  "set-board":t=>{if(!guard())return;const i=S.items[t.dataset.id];const nb=S.boards[t.value];if(!i||!nb)return;
    const g=(nb.groups||[])[0];if(!g){toast("Esse quadro ainda não tem grupos.");t.value=i.boardId;return;}
    patchItem(i.id,{boardId:nb.id,groupId:g.id});toast("Movido para "+nb.name+".");render();},
  "set-recur":t=>{if(!guard())return;const i=S.items[t.dataset.id];if(!i)return;patchItem(i.id,{recur:withAnchor(t.value,i.due)});
    if(t.value&&!i.due)toast("Sem prazo, a próxima vez conta a partir do dia em que marcar como Feito.",6000);render();},
  "notes":t=>{const i=S.items[t.dataset.id];if(i&&t.value!==(i.notes||"")&&guard())patchItem(i.id,{notes:t.value});},
  "cl-toggle":t=>{const cid=t.dataset.cid;patchChecklist(cl=>cl.map(c=>c.id===cid?{...c,d:t.checked}:c));render();},
  "cl-text":t=>{const cid=t.dataset.cid;const v=t.value.trim();const i=S.items[S.open];const c=i&&(i.checklist||[]).find(x=>x.id===cid);if(!c)return;if(!v){t.value=c.t;return;}if(v!==c.t)patchChecklist(cl=>cl.map(x=>x.id===cid?{...x,t:v}:x));},
  "upload":t=>{const files=[...(t.files||[])];const id=t.dataset.id;t.value="";uploadFiles(id,files);},
  "person":t=>{S.person=t.value;renderView();},
  "mywho":t=>{S.myWho=t.value;savePrefs();render();}
};
document.addEventListener("click",e=>{
  const p=$("#pop");
  if(!p.hidden&&!p.contains(e.target)&&!(popAnchor&&popAnchor.contains(e.target)))closePop();
  if(e.target.closest("a[href]"))return;
  const t=e.target.closest("[data-act]");if(!t||t.disabled)return;
  const f=CLICK[t.dataset.act];if(f){e.preventDefault();f(t,e);}
});
document.addEventListener("change",e=>{const t=e.target.closest("[data-act]");if(t&&CHANGE[t.dataset.act])CHANGE[t.dataset.act](t);});
document.addEventListener("input",e=>{const t=e.target;if(!t.dataset)return;if(t.dataset.act==="q"){S.q=t.value;renderView();}else if(t.dataset.act==="draft")S.draft=t.value;else if(t.dataset.act==="add-row")rowDraft[rowKey(t)]=t.value;});
document.addEventListener("submit",e=>{const f=e.target;if(f.dataset.form==="first-board"){e.preventDefault();const v=(f.n.value||S.draft||"").trim();S.draft="";createBoard(v);}});
document.addEventListener("keydown",e=>{
  const t=e.target;
  if(e.key==="Escape"){if(!$("#pop").hidden){closePop();return;}if(S.open){S.open=null;render();return;}}
  if(e.key==="Enter"&&t.id==="d-comment"&&(e.ctrlKey||e.metaKey)){e.preventDefault();addComment();return;}
  if(e.key==="Enter"&&t.dataset){
    const a=t.dataset.act;
    if(a==="add-row"){e.preventDefault();addFromRow(t,true);}
    else if(a==="cl-add"){e.preventDefault();const v=t.value.trim();if(!v)return;t.value="";patchChecklist(cl=>[...cl,{id:uid(),t:v,d:false}]);render();const n=$(".cladd");n&&n.focus();}
    else if(a==="iname"||a==="btitle"||a==="gname"||a==="cl-text"){e.preventDefault();t.blur();}
    else if(t.classList.contains("card")){e.preventDefault();CLICK.open(t);}
  }
});
/* checklist: passo escrito e caixa abandonada também conta */
document.addEventListener("focusout",e=>{const t=e.target;if(t&&t.dataset&&t.dataset.act==="cl-add"&&t.value.trim()){const v=t.value.trim();t.value="";patchChecklist(cl=>[...cl,{id:uid(),t:v,d:false}]);pending=true;}});

/* arrastar: kanban (estado) e tabela (ordem e grupo) */
let dragRow=null,dragCal=null;
document.addEventListener("dragstart",e=>{
  const g=e.target.closest&&e.target.closest("[data-rowdrag]");
  if(g){dragRow=g.dataset.rowdrag;e.dataTransfer.setData("text/plain",dragRow);e.dataTransfer.effectAllowed="move";const tr=g.closest("tr");tr&&tr.classList.add("dragging");return;}
  const cal=e.target.closest&&e.target.closest("[data-caldrag]");
  if(cal){if(S.readOnly){e.preventDefault();return;}dragCal=cal.dataset.caldrag;e.dataTransfer.setData("text/plain",dragCal);e.dataTransfer.effectAllowed="move";cal.classList.add("dragging");return;}
  const c=e.target.closest&&e.target.closest("[data-drag]");if(!c)return;e.dataTransfer.setData("text/plain",c.dataset.drag);e.dataTransfer.effectAllowed="move";
});
function clearDrop(){document.querySelectorAll(".drop-before,.drop-after,.drop-end").forEach(x=>x.classList.remove("drop-before","drop-after","drop-end"));}
document.addEventListener("dragover",e=>{
  if(dragRow){
    const sec=e.target.closest&&e.target.closest("[data-gsec]");if(!sec)return;e.preventDefault();clearDrop();
    const tr=e.target.closest("tr[data-row]");
    if(tr&&tr.dataset.row!==dragRow){const r=tr.getBoundingClientRect();tr.classList.add(e.clientY<r.top+r.height/2?"drop-before":"drop-after");}
    else if(!tr){const tb=sec.querySelector("tbody tr:last-child");if(tb)tb.classList.add("drop-after");else sec.classList.add("drop-end");}
    return;
  }
  if(dragCal){
    const day=e.target.closest&&e.target.closest("[data-calday]");document.querySelectorAll(".day.over").forEach(x=>x.classList.remove("over"));
    if(day){e.preventDefault();day.classList.add("over");}
    return;
  }
  const col=e.target.closest&&e.target.closest("[data-drop]");if(!col)return;e.preventDefault();document.querySelectorAll(".col.over").forEach(c=>c!==col&&c.classList.remove("over"));col.classList.add("over");
});
document.addEventListener("dragleave",e=>{const col=e.target.closest&&e.target.closest("[data-drop],[data-calday]");if(col&&!col.contains(e.relatedTarget))col.classList.remove("over");});
document.addEventListener("dragend",()=>{dragRow=null;dragCal=null;clearDrop();document.querySelectorAll(".dragging,.day.over").forEach(x=>x.classList.remove("dragging","over"));});
document.addEventListener("drop",e=>{
  if(dragRow){
    const id=dragRow;dragRow=null;
    const sec=e.target.closest&&e.target.closest("[data-gsec]");
    const marked=document.querySelector(".drop-before,.drop-after");const before=marked&&marked.classList.contains("drop-before");const target=marked&&marked.dataset.row;
    clearDrop();document.querySelectorAll(".dragging").forEach(x=>x.classList.remove("dragging"));
    if(!sec||!guard())return;e.preventDefault();
    const it=S.items[id];if(!it)return;const gid=sec.dataset.gsec;
    const list=visible(it.boardId).filter(i=>i.groupId===gid&&i.id!==id);
    let idx=list.length;if(target&&target!==id){const k=list.findIndex(i=>i.id===target);if(k>=0)idx=before?k:k+1;}
    const prev=list[idx-1],next=list[idx];
    const order=prev&&next?(prev.order+next.order)/2:prev?prev.order+1000:next?next.order-1000:Date.now();
    if(gid===it.groupId&&order===it.order)return;
    patchItem(id,{order,groupId:gid});renderView();return;
  }
  if(dragCal){
    const id=dragCal;dragCal=null;document.querySelectorAll(".day.over,.dragging").forEach(x=>x.classList.remove("over","dragging"));
    const day=e.target.closest&&e.target.closest("[data-calday]");if(!day||!guard())return;e.preventDefault();
    const it=S.items[id];if(!it)return;const nd=day.dataset.calday;if(it.due===nd)return;
    const p={due:nd};if(it.recur&&/^[my]/.test(it.recur))p.recur=withAnchor(it.recur.split("@")[0],nd);
    patchItem(id,p);S.calSel=nd;renderView();return;
  }
  const col=e.target.closest&&e.target.closest("[data-drop]");if(!col)return;e.preventDefault();col.classList.remove("over");
  const id=e.dataTransfer.getData("text/plain");const i=S.items[id];if(i&&i.status!==col.dataset.drop&&guard()){setStatus(id,col.dataset.drop);renderView();}});
addEventListener("resize",closePop);
document.addEventListener("scroll",closePop,true);

init();
})();
</script>
